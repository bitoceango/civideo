<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>儿童视频</title>
  <style>
    :root { --bg:#15171C; --accent:#36B4C9; --text:#F2F3F5; --muted:#7E828A; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
    .center { height: 100vh; display: grid; place-items: center; text-align: center; }
    .dot { width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(140deg, #53CFE0, #7AD0B0); margin: 0 auto 16px;
      display: grid; place-items: center; font-size: 30px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="center">
    <div>
      <div class="dot">🚀</div>
      <h1>儿童视频</h1>
      <p>Windows 客户端 · 脚手架就绪（界面开发中 — 见 issue #3）</p>
    </div>
  </div>
  <!-- Epic B(#3) 将在此挂载激活 / 首页 / 分类 / 我的 / 播放器 -->
  <script src="app.js" type="module"></script>
</body>
</html>
