[package]
name = "childvideo"
version = "0.1.0"
description = "儿童视频流媒体 Windows 客户端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "childvideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 家长上传：文件选择 / 读本地文件 / 经 Rust 发 HTTP（绕过 webview CORS）
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
