name: Deploy Worker (合并到 main 自动部署)

# 根治「并行从过期检出手动 wrangler deploy 互相覆盖」的问题：
# 唯一部署源 = 合并到 main 后由本 CI 部署，开发者不再手动 deploy worker。
#
# 需在仓库 Settings → Secrets and variables → Actions 配置：
#   Secret:    CLOUDFLARE_API_TOKEN  （有 Workers 脚本 + R2 + D1 编辑权限的 API Token）
#   Variables: CF_ACCOUNT_ID, D1_DATABASE_ID, CF_DOMAIN
#              （wrangler.jsonc 已 gitignore 不入库，CI 用这些变量现生成；这些不算机密）
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成 wrangler.jsonc（私密配置不入库，由仓库变量生成）
        run: |
          cat > worker/wrangler.jsonc <<JSON
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "child-video-api",
            "main": "src/index.js",
            "compatibility_date": "2026-06-01",
            "workers_dev": false,
            "routes": [{ "pattern": "${{ vars.CF_DOMAIN }}", "custom_domain": true }],
            "r2_buckets": [{ "binding": "BUCKET", "bucket_name": "child-video" }],
            "d1_databases": [
              { "binding": "DB", "database_name": "child-video-db", "database_id": "${{ vars.D1_DATABASE_ID }}" }
            ],
            "observability": { "enabled": true }
          }
          JSON

      - name: 安装依赖
        working-directory: worker
        run: npm install

      - name: 迁移 D1（幂等）+ 部署
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute child-video-db --remote --file=./schema.sql -y
          npx wrangler deploy
